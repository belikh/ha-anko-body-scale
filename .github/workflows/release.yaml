name: Release

on:
  push:
    tags:
      # Existing tags are numeric (2.0.2); v-prefixed tags stay supported.
      - 'v*'
      - '[0-9]*'

# softprops/action-gh-release needs to create the release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # A tag with a hyphen (1.3.0-rc.1) is a pre-release. Its notes come
          # from the changelog section of the base version (1.3.0).
          base="${tag%%-*}"
          if [ "$base" != "$tag" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          body="$(awk -v ver="$base" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -n "$body" ]; then
            { echo "# Release notes — v${tag}"; echo; echo "$body"; } > release_body.md
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (changelog body)
        if: steps.changelog.outputs.has_body == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          prerelease: ${{ steps.changelog.outputs.prerelease == 'true' }}
          files: |
            custom_components/anko_scale/manifest.json

      - name: Create Release (generated notes)
        if: steps.changelog.outputs.has_body != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.changelog.outputs.prerelease == 'true' }}
          files: |
            custom_components/anko_scale/manifest.json
