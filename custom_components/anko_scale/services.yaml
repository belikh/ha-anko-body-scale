assign_measurement:
  fields:
    pending_id:
      required: true
      example: "3fa91c0b"
      selector:
        text:
    person_id:
      required: true
      example: "jupiter"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: anko_scale

discard_measurement:
  fields:
    pending_id:
      required: true
      example: "3fa91c0b"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: anko_scale

reassign_measurement:
  fields:
    person_id:
      required: true
      example: "sarah"
      selector:
        text:

set_next_person:
  fields:
    person_id:
      required: false
      example: "jupiter"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: anko_scale

reset_person_history:
  fields:
    person_id:
      required: true
      example: "jupiter"
      selector:
        text:

capture_measurement:
  fields:
    timeout:
      required: false
      default: 60
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: anko_scale
